services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: context
      POSTGRES_PASSWORD: context
      POSTGRES_DB: personal_context
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context -d personal_context"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
